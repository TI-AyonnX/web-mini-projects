<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissor</title>

  <link rel="stylesheet" href="rock-paper-scissor.css">

</head>

<body>
  <p class="rock-paper-scissor">
    Rock Paper Scissor
  </p>

  <button class="edit-rps-button js-rock-button">
    <img class="edit-emoji" src="images/rock-emoji.png" alt="rock">
  </button>

  <button class="edit-rps-button js-paper-button">
    <img class="edit-emoji" src="images/paper-emoji.png" alt="paper">
  </button>

  <button class="edit-rps-button js-scissor-button">
    <img class="edit-emoji" src="images/scissor-emoji.png" alt="scissor">
  </button>

  <p class="js-result edit-js-result">
    <!-- will show results -->
  </p>

  <p class="js-moves">
    <!-- will show the moves -->
  </p>

  <p class="js-score score">
    <!-- will show updated scores -->
  </p>

  <button class="edit-reset-score-button js-reset-score">
    Reset score
  </button>

  <button class="edit-auto-play-button js-auto-play">
    Auto Play
  </button>

  <div class="js-confirm-reset-score">
     <!-- will show the confirmation for reset score -->
  </div>

  <script src="rock-paper-scissor.js">
  </script>
</body>

</html>
